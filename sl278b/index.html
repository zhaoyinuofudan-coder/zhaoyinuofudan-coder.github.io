<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SL278B 只读诊断 v3</title><style>:root{color-scheme:dark;--bg:#0c0d11;--panel:#171920;--ink:#f5f3f4;--muted:#aaa5ad;--green:#4ac78b;--line:#30333d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#42182a 0,transparent 30%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:22px 16px 40px}.app{max-width:680px;margin:auto}h1{font-size:27px;margin:8px 0}.sub,.small{color:var(--muted);font-size:12px;line-height:1.65}.warn{margin:18px 0;padding:13px 15px;border:1px solid #66404b;background:#27161c;border-radius:15px;font-size:12px;line-height:1.6}.card{background:rgba(23,25,32,.95);border:1px solid var(--line);border-radius:20px;padding:16px;margin:13px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:14px;padding:13px;font-weight:750;color:#fff;background:#30333d}.primary{background:linear-gradient(135deg,#b42a4b,#781c34)}.btn:disabled{opacity:.45}.status{font-size:13px;line-height:1.6}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#737782;margin-right:7px}.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}pre{white-space:pre-wrap;word-break:break-word;background:#0b0c10;border-radius:14px;padding:13px;min-height:220px;color:#d9d6da;font-size:12px;line-height:1.55}.good{color:#70dda6}.bad{color:#ff8aa2}</style></head><body><main class="app"><h1>SL278B 只读诊断 <small>v3</small></h1><div class="sub">只连接并列出 GATT 服务／特征；不会向设备写入任何数据。</div><div class="warn"><b>先强行停止 SVAKOM PLUS。</b> 玩具关机 15 秒后再开，只开一个部件。不要在系统蓝牙设置里预先配对。</div><section class="card"><div class="actions"><button id="named" class="btn primary">按名称查找</button><button id="all" class="btn">显示附近设备</button><button id="retry" class="btn" disabled>干净重连</button><button id="disconnect" class="btn" disabled>断开</button></div><p class="status"><i id="dot" class="dot"></i><span id="status">尚未连接</span></p><div id="summary" class="status"></div></section><section class="card"><b>分阶段日志</b><pre id="log">等待操作。连接超过 15 秒会自动中止并显示卡住的阶段。</pre><div class="small">截图日志即可；页面不显示蓝牙地址、邀请码或账号。</div></section></main><script>
const $=s=>document.querySelector(s),logEl=$('#log'),statusEl=$('#status'),dot=$('#dot'),summary=$('#summary'),named=$('#named'),all=$('#all'),retry=$('#retry'),disconnect=$('#disconnect');let device=null,busy=false;const FFE0='0000ffe0-0000-1000-8000-00805f9b34fb',FFE1='0000ffe1-0000-1000-8000-00805f9b34fb',AE00='0000ae00-0000-1000-8000-00805f9b34fb';
function log(t){logEl.textContent+='\n['+new Date().toLocaleTimeString()+'] '+t}function clear(t){logEl.textContent='['+new Date().toLocaleTimeString()+'] '+t}function status(t,ok=false){statusEl.textContent=t;dot.classList.toggle('ok',ok)}function buttons(on){busy=on;named.disabled=on;all.disabled=on;retry.disabled=on||!device;disconnect.disabled=on||!device?.gatt?.connected}function wait(ms){return new Promise(r=>setTimeout(r,ms))}function timeout(p,ms,label){let id;return Promise.race([p,new Promise((_,rej)=>id=setTimeout(()=>rej(new Error(label+'超过 '+ms/1000+' 秒')),ms))]).finally(()=>clearTimeout(id))}function props(c){return ['read','write','writeWithoutResponse','notify','indicate'].filter(k=>c.properties[k]).join(', ')||'none'}function onDisconnected(){log('收到设备断开事件');status('已断开');buttons(false)}
async function inspect(server){log('GATT 已连接，开始枚举服务');const services=await timeout(server.getPrimaryServices(),10000,'枚举服务');let lines=['设备名称：'+(device.name||'(未命名)')],f0=false,f1=false,w=false;for(const s of services){const su=s.uuid.toLowerCase();lines.push('SERVICE '+su+(su===FFE0?' ← FFE0':''));if(su===FFE0)f0=true;let cs=[];try{cs=await timeout(s.getCharacteristics(),6000,'枚举特征')}catch(e){lines.push('  (特征读取失败：'+e.message+')')}for(const c of cs){const cu=c.uuid.toLowerCase(),p=props(c);lines.push('  CHAR '+cu+' ['+p+']'+(cu===FFE1?' ← FFE1':''));if(cu===FFE1){f1=true;w=!!(c.properties.write||c.properties.writeWithoutResponse)}}}clear(lines.join('\n'));summary.innerHTML=`FFE0：<b class="${f0?'good':'bad'}">${f0?'找到':'未找到'}</b>　FFE1：<b class="${f1?'good':'bad'}">${f1?'找到':'未找到'}</b>　可写：<b class="${w?'good':'bad'}">${w?'有':'未确认'}</b>`;status('诊断完成',true)}
async function connectSelected(clean=false){if(!device)return;buttons(true);summary.textContent='';try{if(device.gatt.connected){log('先断开旧 GATT 会话');device.gatt.disconnect();await wait(1200)}if(clean){log('等待蓝牙栈释放旧会话');await wait(2500)}status('正在建立 GATT 连接…');log('调用 gatt.connect()');const server=await timeout(device.gatt.connect(),15000,'gatt.connect()');log('gatt.connect() 成功');await inspect(server)}catch(e){try{if(device?.gatt?.connected)device.gatt.disconnect()}catch(_){}status('连接未完成');log('失败阶段：'+e.message);log('建议：玩具关机 15 秒；手机蓝牙关开；只开一个部件；再点“干净重连”。')}finally{buttons(false)}}
async function choose(showAll){if(busy)return;clear('打开系统设备选择器');summary.textContent='';try{device=await navigator.bluetooth.requestDevice(showAll?{acceptAllDevices:true,optionalServices:[FFE0,AE00]}:{filters:[{namePrefix:'SL278'}],optionalServices:[FFE0,AE00]});device.addEventListener('gattserverdisconnected',onDisconnected);log('已选设备：'+(device.name||'(未命名)'));retry.disabled=false;await connectSelected(false)}catch(e){status('连接未完成');log(e.name==='NotFoundError'?'设备选择被取消，或列表中没有可选设备。':e.name+': '+e.message);buttons(false)}}
named.onclick=()=>choose(false);all.onclick=()=>choose(true);retry.onclick=()=>connectSelected(true);disconnect.onclick=()=>{if(device?.gatt?.connected)device.gatt.disconnect();else onDisconnected()};if(!navigator.bluetooth){named.disabled=all.disabled=true;status('此浏览器没有 Web Bluetooth');clear('请用安卓最新版 Chrome 通过 HTTPS 打开。')}
</script></body></html>
