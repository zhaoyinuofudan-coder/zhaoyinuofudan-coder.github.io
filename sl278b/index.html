<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SL278B 只读诊断</title><style>:root{color-scheme:dark;--bg:#0c0d11;--panel:#171920;--ink:#f5f3f4;--muted:#aaa5ad;--green:#4ac78b;--line:#30333d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#42182a 0,transparent 30%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:22px 16px 40px}.app{max-width:680px;margin:auto}h1{font-size:27px;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.65}.warn{margin:18px 0;padding:13px 15px;border:1px solid #66404b;background:#27161c;border-radius:15px;font-size:12px;line-height:1.6}.card{background:rgba(23,25,32,.95);border:1px solid var(--line);border-radius:20px;padding:16px;margin:13px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:14px;padding:13px;font-weight:750;color:#fff;background:#30333d}.primary{background:linear-gradient(135deg,#b42a4b,#781c34)}.btn:disabled{opacity:.45}.status{font-size:13px;line-height:1.6}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#737782;margin-right:7px}.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}pre{white-space:pre-wrap;word-break:break-word;background:#0b0c10;border-radius:14px;padding:13px;min-height:170px;color:#d9d6da;font-size:12px;line-height:1.55}.good{color:#70dda6}.bad{color:#ff8aa2}.small{font-size:11px;color:var(--muted);margin-top:10px}</style></head><body><main class="app"><h1>SL278B 只读诊断</h1><div class="sub">只连接并列出浏览器可访问的 GATT 服务／特征。页面没有任何写入按钮，也不会发送控制指令。</div><div class="warn"><b>先彻底退出 SVAKOM PLUS。</b> 玩具开机并靠近手机。若“按名称查找”列表为空，改用“显示附近设备”。不要选择耳机、手表等其他设备。</div><section class="card"><div class="actions"><button id="connect" class="btn primary">按名称查找</button><button id="all" class="btn">显示附近设备</button><button id="disconnect" class="btn" disabled>断开</button></div><p class="status"><i id="dot" class="dot"></i><span id="status">尚未连接</span></p><div id="summary" class="status"></div></section><section class="card"><b>诊断结果</b><pre id="log">先试“按名称查找”；列表里没有设备，再点“显示附近设备”。</pre><div class="small">若你关闭了系统设备选择窗口，页面会显示“已取消选择”，这不是连接故障。</div></section></main><script>const logEl=document.querySelector('#log'),statusEl=document.querySelector('#status'),dot=document.querySelector('#dot'),summary=document.querySelector('#summary'),connectBtn=document.querySelector('#connect'),allBtn=document.querySelector('#all'),disconnectBtn=document.querySelector('#disconnect');let device=null;const FFE0='0000ffe0-0000-1000-8000-00805f9b34fb',FFE1='0000ffe1-0000-1000-8000-00805f9b34fb',AE00='0000ae00-0000-1000-8000-00805f9b34fb';function setStatus(t,ok=false){statusEl.textContent=t;dot.classList.toggle('ok',ok)}function props(c){return ['read','write','writeWithoutResponse','notify','indicate'].filter(k=>c.properties[k]).join(', ')||'none'}function disconnected(){setStatus('已断开');disconnectBtn.disabled=true;connectBtn.disabled=false;allBtn.disabled=false}async function scan(showAll){logEl.textContent='正在请求设备…';summary.textContent='';try{const options=showAll?{acceptAllDevices:true,optionalServices:[FFE0,AE00]}:{filters:[{namePrefix:'SL278'}],optionalServices:[FFE0,AE00]};device=await navigator.bluetooth.requestDevice(options);device.addEventListener('gattserverdisconnected',disconnected);setStatus('正在连接 '+(device.name||'未命名设备')+'…');const server=await device.gatt.connect();setStatus('已连接 '+(device.name||'未命名设备'),true);connectBtn.disabled=true;allBtn.disabled=true;disconnectBtn.disabled=false;const services=await server.getPrimaryServices();let lines=['设备名称：'+(device.name||'(未命名)')],foundFFE0=false,foundFFE1=false,writable=false;for(const s of services){const su=s.uuid.toLowerCase();lines.push('SERVICE  '+su+(su===FFE0?'  ← FFE0 候选控制服务':''));if(su===FFE0)foundFFE0=true;let chars=[];try{chars=await s.getCharacteristics()}catch(e){lines.push('  (无法枚举特征: '+e.message+')')}for(const c of chars){const cu=c.uuid.toLowerCase(),p=props(c);lines.push('  CHAR   '+cu+'  ['+p+']'+(cu===FFE1?'  ← FFE1 候选控制特征':''));if(cu===FFE1){foundFFE1=true;writable=!!(c.properties.write||c.properties.writeWithoutResponse)}}}logEl.textContent=lines.join('\n')||'没有枚举到服务。';summary.innerHTML=`FFE0：<b class="${foundFFE0?'good':'bad'}">${foundFFE0?'找到':'未找到'}</b>　FFE1：<b class="${foundFFE1?'good':'bad'}">${foundFFE1?'找到':'未找到'}</b>　可写属性：<b class="${writable?'good':'bad'}">${writable?'有':'未确认'}</b>`}catch(e){setStatus('连接未完成');logEl.textContent=e.name==='NotFoundError'?'已取消选择，或列表中没有可选设备。\n\n请确认：SVAKOM PLUS 已彻底退出；玩具已开机；Chrome 已获“附近的设备”权限。若按名称找不到，试“显示附近设备”。':e.name+': '+e.message;connectBtn.disabled=false;allBtn.disabled=false;disconnectBtn.disabled=true}}connectBtn.onclick=()=>scan(false);allBtn.onclick=()=>scan(true);disconnectBtn.onclick=()=>{if(device?.gatt?.connected)device.gatt.disconnect();else disconnected()};if(!navigator.bluetooth){connectBtn.disabled=true;allBtn.disabled=true;setStatus('此浏览器没有 Web Bluetooth');logEl.textContent='请使用安卓最新版 Chrome，并确保通过 HTTPS 打开。'}</script></body></html>
