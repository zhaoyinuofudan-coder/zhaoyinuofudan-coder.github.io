<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SL278B 空载测试 v2</title><style>body{margin:0;padding:24px 16px;background:#0d0c10;color:#f8f3f5;font-family:system-ui}.app{max-width:600px;margin:auto}.card{background:#1d1820;border:1px solid #3d3038;border-radius:20px;padding:18px;margin:14px 0}.warn{color:#ffc1cf;line-height:1.6}button{width:100%;margin:6px 0;padding:14px;border:0;border-radius:14px;background:#a92549;color:white;font-weight:750;font-size:15px}button.stop{background:#e7e2e4;color:#281d22}button:disabled{opacity:.4}pre{white-space:pre-wrap;line-height:1.55;color:#cfc5ca}.ok{color:#66dda3}</style></head><body><main class="app"><h1>SL278B 空载测试 v2</h1><div class="card warn"><b>玩具必须放在桌面，不能接触身体。</b><br>本次以约 30% 强度运行 1 秒并自动停止。页面只写入 FFE1，不访问 AE00／AE01。</div><section class="card"><button id="connect">1. 连接 SL278B</button><button id="test" disabled>2. 30% 运行 1 秒</button><button id="stop" class="stop" disabled>立即停止</button><button id="disconnect" class="stop" disabled>停止并断开</button><pre id="log">等待连接。</pre></section></main><script>
const FFE0='0000ffe0-0000-1000-8000-00805f9b34fb',FFE1='0000ffe1-0000-1000-8000-00805f9b34fb';const $=x=>document.querySelector(x),log=$('#log'),connect=$('#connect'),test=$('#test'),stop=$('#stop'),disconnect=$('#disconnect');let dev,ch,timer;function msg(s){log.textContent+='\n'+s}function packet(a){return Uint8Array.from(a)}async function write(a){if(!ch)throw Error('尚未连接');await ch.writeValueWithoutResponse(packet(a))}async function halt(){clearTimeout(timer);try{await write([0x55,0x04,0,0,0,0,0xAA]);msg('已发送停止指令')}catch(e){msg('停止失败：'+e.message)}}function lost(){clearTimeout(timer);ch=null;test.disabled=stop.disabled=disconnect.disabled=true;connect.disabled=false;msg('设备已断开')}connect.onclick=async()=>{log.textContent='打开设备选择器…';try{dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'SL278'}],optionalServices:[FFE0]});dev.addEventListener('gattserverdisconnected',lost);msg('连接 GATT…');const server=await dev.gatt.connect();const service=await server.getPrimaryService(FFE0);ch=await service.getCharacteristic(FFE1);if(!ch.properties.writeWithoutResponse)throw Error('FFE1 不支持 writeWithoutResponse');connect.disabled=true;test.disabled=stop.disabled=disconnect.disabled=false;log.innerHTML='<span class="ok">连接成功：'+(dev.name||'SL278B')+' / FFE1 可写</span>'}catch(e){msg('连接失败：'+e.name+' '+e.message)}};test.onclick=async()=>{test.disabled=true;try{await write([0x55,0x04,0,0,0x01,0x4D,0xAA]);msg('已发送 30% 测试；1 秒后自动停止');timer=setTimeout(async()=>{await halt();test.disabled=false},1000)}catch(e){msg('测试失败：'+e.message);await halt();test.disabled=false}};stop.onclick=halt;disconnect.onclick=async()=>{await halt();if(dev?.gatt?.connected)dev.gatt.disconnect()};window.addEventListener('pagehide',()=>{if(dev?.gatt?.connected){try{ch.writeValueWithoutResponse(packet([0x55,0x04,0,0,0,0,0xAA]))}catch(e){}}});</script></body></html>
