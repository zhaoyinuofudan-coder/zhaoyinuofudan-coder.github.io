<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLE Accessory Relay</title><style>body{margin:0;background:#0d0c10;color:#faf5f7;font:16px system-ui}.a{max-width:680px;margin:auto;padding:18px}.c{background:#1d1820;border:1px solid #46343e;border-radius:18px;padding:16px;margin:12px 0;line-height:1.6}.w{color:#ffc0d0}input,button{width:100%;box-sizing:border-box;padding:14px;margin:6px 0;border-radius:13px;font-size:16px}input{border:1px solid #604651;background:#120f14;color:#fff}button{border:0;background:#a92549;color:#fff;font-weight:800}.s{background:#f2ecef;color:#281d22;font-size:20px}.x{background:#493741}button:disabled{opacity:.4}pre{white-space:pre-wrap;word-break:break-word}.ok{color:#6ee0a8}.bad{color:#ff8ca8}</style></head><body><main class="a"><h1>BLE Accessory Relay</h1><div class="c w"><b>首次仅做桌面空载测试，不能接触身体。</b><br>仅写 FFE1；远程命令上限 30%、最长 1 秒；过期、重放、令牌错误、断线或切后台都会拒绝或停止。</div><div class="c"><input id="topic" placeholder="私有 topic"><input id="token" type="password" placeholder="私有 token"><button id="save" class="x">保存本机私密配置</button><p id="env"></p><button id="ble">1. 连接 BLE 设备</button><button id="relay" disabled>2. 开启安全中继</button><button id="stop" class="s" disabled>立即停止</button><button id="off" class="x" disabled>停止并断开</button><pre id="log">等待操作。</pre></div></main><script>const F0='0000ffe0-0000-1000-8000-00805f9b34fb',F1='0000ffe1-0000-1000-8000-00805f9b34fb',STOP=[85,4,0,0,0,0,170],MI=30,MD=1000,SK=15000,$=s=>document.querySelector(s),L=$('#log');let dev,ch,es,timer,seen=[];$('#topic').value=localStorage.slTopic||'';$('#token').value=localStorage.slToken||'';function log(s,c=''){L.textContent=new Date().toLocaleTimeString()+' '+s+'\n'+L.textContent;L.className=c}function b(a){return Uint8Array.from(a)}async function write(a){if(!ch)throw Error('BLE 未连接');await ch.writeValueWithoutResponse(b(a))}async function halt(r='急停'){clearTimeout(timer);try{if(ch)await write(STOP);log('已停止：'+r,'ok')}catch(e){log('停止失败：'+e.message,'bad')}}function ui(on){$('#ble').disabled=on;$('#relay').disabled=!on;$('#stop').disabled=!on;$('#off').disabled=!on}function closeRelay(){if(es)es.close();es=null;$('#relay').textContent='2. 开启安全中继'}function lost(){halt('BLE 断开');ch=null;closeRelay();ui(false);log('设备已断开','bad')}async function handle(c){let n=Date.now(),k=localStorage.slToken;if(!c||c.v!==1||c.token!==k||!c.nonce||seen.includes(c.nonce)||Math.abs(n-c.issuedAt)>SK||c.expiresAt<n)return log('拒绝令牌错误、过期或重放命令','bad');seen.push(c.nonce);seen=seen.slice(-100);if(c.action==='stop')return halt('远程急停');if(c.action!=='pulse')return log('拒绝未知动作','bad');let i=+c.intensity,d=+c.durationMs;if(i<1||i>MI||d<50||d>MD)return log('拒绝越界命令','bad');let v=Math.max(1,Math.round(i/100*255));await write([85,4,0,0,1,v,170]);log('执行 '+i+'% / '+d+'ms','ok');clearTimeout(timer);timer=setTimeout(()=>halt('自动停止'),d)}$('#save').onclick=()=>{let t=$('#topic').value.trim(),k=$('#token').value.trim();if(t.length<40||k.length<40)return log('topic/token 太短，拒绝保存','bad');localStorage.slTopic=t;localStorage.slToken=k;log('私密配置仅保存于本机浏览器','ok')};$('#ble').onclick=async()=>{try{dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'SL278'}],optionalServices:[F0]});dev.addEventListener('gattserverdisconnected',lost);let s=await dev.gatt.connect(),v=await s.getPrimaryService(F0);ch=await v.getCharacteristic(F1);if(!ch.properties.writeWithoutResponse)throw Error('FFE1 不可写');ui(true);log('BLE 连接成功，仅 FFE1 可写','ok')}catch(e){log('连接失败：'+e.message,'bad')}};$('#relay').onclick=()=>{if(es){closeRelay();halt('关闭中继');return}let t=localStorage.slTopic,k=localStorage.slToken;if(!t||!k)return log('先保存私密配置','bad');es=new EventSource('https://ntfy.sh/'+encodeURIComponent(t)+'/sse?since=all');es.onopen=()=>{$('#relay').textContent='关闭安全中继';log('中继在线，等待带令牌命令','ok')};es.onerror=()=>{halt('中继异常');log('中继异常，浏览器可能自动重连','bad')};es.onmessage=async e=>{try{let o=JSON.parse(e.data);if(o.message)await handle(JSON.parse(o.message))}catch(x){log('忽略坏消息','bad')}}};$('#stop').onclick=()=>halt('本地立即停止');$('#off').onclick=async()=>{await halt('停止并断开');closeRelay();if(dev?.gatt?.connected)dev.gatt.disconnect();else lost()};document.addEventListener('visibilitychange',()=>{if(document.hidden)halt('页面切后台')});addEventListener('pagehide',()=>{if(ch)try{ch.writeValueWithoutResponse(b(STOP))}catch(e){}});let ok=isSecureContext&&navigator.bluetooth&&crypto.subtle;$('#env').innerHTML=ok?'<b class="ok">HTTPS / Web Bluetooth 可用</b>':'<b class="bad">请用 Mate 50 Edge 通过 HTTPS 打开</b>';$('#ble').disabled=!ok;</script></body></html>
