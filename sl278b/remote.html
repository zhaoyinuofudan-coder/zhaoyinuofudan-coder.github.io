<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SL278B Clean Relay</title><style>body{margin:0;background:#0d0c10;color:#faf7f8;font:16px system-ui}main{max-width:680px;margin:auto;padding:18px}.card{background:#1d1820;border:1px solid #493640;border-radius:18px;padding:16px;margin:12px 0}input,button{box-sizing:border-box;width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;font-size:16px}input{background:#120f14;color:#fff;border:1px solid #604651}button{background:#ad2850;color:#fff;font-weight:800}.stop{background:#f3edf0;color:#281d22}.ok{color:#6ee0a8}.bad{color:#ff8ca8}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main><h1>SL278B Clean Relay</h1><div class="card"><p>固定频道：<code id="topicLabel"></code></p><input id="token" type="password" placeholder="私人 token"><button id="saveToken">保存 token 到本机</button><p id="env"></p></div><div class="card"><button id="listen">1. 开启消息测试</button><button id="ble" disabled>2. 连接 SL278B</button><button id="arm" disabled>3. 允许设备命令</button><button id="stop" class="stop">立即停止</button><button id="off" class="stop">停止并断开</button><pre id="log">等待操作。</pre></div></main><script>const TOPIC='aru-sl278b-878ff64e0746a499ec19528d39b20329af3f99b8a046cf9b';const FFE0='0000ffe0-0000-1000-8000-00805f9b34fb',FFE1='0000ffe1-0000-1000-8000-00805f9b34fb';const STOP=new Uint8Array([85,4,0,0,0,0,170]);const MINI=60,MAXI=100,MAXD=3000000,SKEW=30000;const $=s=>document.querySelector(s),L=$('#log');let es,dev,ch,armed=false,seen=[],planSeq=0;$('#topicLabel').textContent=TOPIC;$('#token').value=localStorage.cleanToken||'';function log(s,c=''){L.className=c;L.textContent=new Date().toLocaleTimeString()+' '+s+'\n'+L.textContent}function closeStream(){if(es){es.close();es=null}}async function write(a){if(!ch)throw Error('BLE 未连接');await ch.writeValueWithoutResponse(a)}const wait=ms=>new Promise(r=>setTimeout(r,ms));async function motorStop(reason){clearTimeout(window.pulseTimer);try{if(ch){await write(STOP);await wait(80);await write(STOP);await wait(80);await write(STOP)}log('已停止：'+reason,'ok')}catch(e){log('停止失败：'+e.message,'bad')}}async function halt(reason='本地停止'){planSeq++;armed=false;$('#arm').textContent='3. 允许设备命令';await motorStop(reason)}async function receive(c){const now=Date.now(),token=localStorage.cleanToken||'';if(!c||c.v!==2)return;if(c.action==='ping'){log('PING 已收到：消息链路正常','ok');$('#ble').disabled=false;return}if(!token||c.token!==token)return log('拒绝：token 不匹配','bad');if(!c.nonce||seen.includes(c.nonce))return log('拒绝：重复命令','bad');if(!Number.isFinite(c.issuedAt)||!Number.isFinite(c.expiresAt)||Math.abs(now-c.issuedAt)>SKEW||c.expiresAt<now)return log('拒绝：命令过期或时钟偏差','bad');seen=[...seen.slice(-99),c.nonce];if(c.action==='stop')return halt('远程停止');if(!armed)return log('拒绝：尚未允许设备命令','bad');if(c.action==='plan'){const segs=Array.isArray(c.segments)?c.segments:[];if(!segs.length||segs.length>60)return log('拒绝：计划为空或过长','bad');const total=segs.reduce((n,x)=>n+Number(x.durationMs||0)+Number(x.pauseAfterMs||0),0);if(total>300000)return log('拒绝：计划超过5分钟','bad');const mine=++planSeq;log('五分钟变档计划开始','ok');for(const x of segs){if(mine!==planSeq||!armed)return;const i=Number(x.intensity),d=Number(x.durationMs),p=Number(x.pauseAfterMs||0);if(!Number.isFinite(i)||!Number.isFinite(d)||!Number.isFinite(p)||i<MINI||i>MAXI||d<100||d>MAXD||p<0||p>60000){await halt('计划参数异常');return}const level=Math.max(1,Math.min(255,Math.round(i/100*255)));await write(new Uint8Array([85,4,0,0,1,level,170]));log('执行 '+i+'% / '+d+'ms','ok');await wait(d);if(mine!==planSeq)return;await motorStop('段落结束');if(p)await wait(p)}if(mine===planSeq)log('五分钟变档计划完成','ok');return}if(c.action!=='pulse')return;const i=Number(c.intensity),d=Number(c.durationMs);if(!Number.isFinite(i)||!Number.isFinite(d)||i<MINI||i>MAXI||d<100||d>MAXD)return log('拒绝：参数超限','bad');const level=Math.max(1,Math.min(255,Math.round(i/100*255)));await write(new Uint8Array([85,4,0,0,1,level,170]));log('执行 '+i+'% / '+d+'ms','ok');clearTimeout(window.pulseTimer);window.pulseTimer=setTimeout(()=>motorStop('自动停止'),d)}$('#saveToken').onclick=()=>{const k=$('#token').value.trim();if(k.length<40)return log('token 长度不足','bad');localStorage.cleanToken=k;log('token 已仅保存于本机','ok')};$('#listen').onclick=()=>{closeStream();const since=Math.floor(Date.now()/1000);es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse?since='+since);es.onopen=()=>log('消息测试已开启，等待 PING','ok');es.onerror=()=>log('消息连接异常','bad');es.onmessage=async e=>{try{const outer=JSON.parse(e.data);const c=typeof outer.message==='string'?JSON.parse(outer.message):outer;await receive(c)}catch(err){log('忽略无法解析的消息','bad')}}};$('#ble').onclick=async()=>{try{dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'SL278B'}],optionalServices:[FFE0]});dev.addEventListener('gattserverdisconnected',()=>{ch=null;armed=false;$('#arm').disabled=true;log('BLE 已断开','bad')});const server=await dev.gatt.connect(),svc=await server.getPrimaryService(FFE0);ch=await svc.getCharacteristic(FFE1);armed=true;$('#arm').disabled=false;$('#arm').textContent='设备命令已允许（点此关闭）';log('BLE 连接成功，设备命令默认允许','ok')}catch(e){log('BLE 连接失败：'+e.message,'bad')}};$('#arm').onclick=()=>{if(!ch)return;armed=!armed;$('#arm').textContent=armed?'设备命令已允许（点此关闭）':'3. 允许设备命令';log(armed?'设备命令已允许':'设备命令已关闭',armed?'ok':'bad')};$('#stop').onclick=()=>halt('本地立即停止');$('#off').onclick=async()=>{await halt('停止并断开');closeStream();try{dev?.gatt?.disconnect()}catch{};ch=null;$('#ble').disabled=true;$('#arm').disabled=true;log('已断开全部连接','ok')};document.addEventListener('visibilitychange',()=>{if(document.hidden)halt('页面切后台')});window.addEventListener('pagehide',()=>{try{if(ch)ch.writeValueWithoutResponse(STOP)}catch{}});$('#env').textContent=location.protocol==='https:'?'HTTPS / Web Bluetooth 可用':'请通过 HTTPS 打开';</script></body></html>
