<html lang="zh-CN"><head data-polaris-auto-key="auto:head:0" data-polaris-persist-bound="1"><meta http-equiv="Content-Security-Policy" content="default-src https: http: data: blob: aru-surface:; script-src 'unsafe-inline' 'unsafe-eval' https: http: data: blob: aru-surface:; style-src 'unsafe-inline' https: http: data: blob: aru-surface:; img-src https: http: data: blob: aru-surface:; font-src https: http: data: blob: aru-surface:; media-src https: http: data: blob: aru-surface:; connect-src https: http: wss: ws: aru-surface:; worker-src blob: data: aru-surface:; manifest-src https: http: aru-surface:; frame-src https: http: 'self'; object-src 'none'; base-uri 'none'" data-polaris-auto-key="auto:meta:0" data-polaris-persist-bound="1"><meta charset="utf-8" data-polaris-auto-key="auto:meta:0" data-polaris-persist-bound="1"><meta name="viewport" content="width=device-width,initial-scale=1" data-polaris-persist-bound="1"><title data-polaris-auto-key="auto:title:0" data-polaris-persist-bound="1">SL278B 安全中继 v3</title><style data-polaris-auto-key="auto:style:0" data-polaris-persist-bound="1">body{margin:0;background:#0d0c10;color:#faf5f7;font:16px system-ui}main{max-width:680px;margin:auto;padding:18px}.card{background:#1d1820;border:1px solid #46343e;border-radius:18px;padding:16px;margin:12px 0}input,button{box-sizing:border-box;width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;font-size:16px}input{background:#120f14;color:#fff;border:1px solid #604651}button{background:#a92549;color:#fff;font-weight:800}.stop{background:#f2ecef;color:#281d22}.ok{color:#6ee0a8}.bad{color:#ff8ca8}pre{white-space:pre-wrap;word-break:break-word}</style></head><body data-polaris-auto-key="auto:body:0" data-polaris-persist-bound="1"><main data-polaris-auto-key="auto:main:0" data-polaris-persist-bound="1"><h1 data-polaris-auto-key="auto:h1:0" data-polaris-persist-bound="1">SL278B 安全中继 v3</h1><div class="card" data-polaris-auto-key="auto:div:0" data-polaris-persist-bound="1"><button id="saveRemote" data-polaris-persist-bound="1">保存 remote.html 到手机</button><p id="saveMsg" data-polaris-persist-bound="1"></p></div><div class="card" data-polaris-auto-key="auto:div:0" data-polaris-persist-bound="1"><input id="topic" placeholder="ntfy topic" data-polaris-persist-bound="1"><input id="token" type="password" placeholder="token" data-polaris-persist-bound="1"><button id="save" data-polaris-persist-bound="1">保存本机私密配置</button><p id="env" data-polaris-persist-bound="1">HTTPS / Web Bluetooth 可用</p></div><div class="card" data-polaris-auto-key="auto:div:0" data-polaris-persist-bound="1"><button id="ble" data-polaris-persist-bound="1">1. 连接 BLE 设备</button><button id="relay" disabled="" data-polaris-persist-bound="1">2. 开启安全中继</button><button id="stop" class="stop" data-polaris-persist-bound="1">立即停止</button><button id="off" class="stop" data-polaris-persist-bound="1">停止并断开</button><pre id="log" data-polaris-persist-bound="1">等待操作。</pre></div></main><script data-polaris-auto-key="auto:script:0" data-polaris-persist-bound="1">const FFE0='0000ffe0-0000-1000-8000-00805f9b34fb',FFE1='0000ffe1-0000-1000-8000-00805f9b34fb',STOP=new Uint8Array([85,4,0,0,0,0,1,170]),MINI=60,MAXI=100,MAXD=3000000,SKEW=30000;const $=s=>document.querySelector(s),L=$('#log');let dev,ch,es,seen=[];$('#topic').value=localStorage.slTopic||'';$('#token').value=localStorage.slToken||'';function log(s,c=''){L.className=c;L.textContent=new Date().toLocaleTimeString()+' '+s+'\n'+L.textContent}function save(){let t=$('#topic').value.trim(),k=$('#token').value.trim();if(t.length<20||k.length<40)return log('topic/token 长度不对','bad');localStorage.slTopic=t;localStorage.slToken=k;log('私密配置已保存','ok')}async function write(a){if(!ch)throw Error('BLE 未连接');await ch.writeValueWithoutResponse(a)}async function halt(){try{clearTimeout(window.pulseTimer);if(ch)await write(STOP);log('已发送停止','ok')}catch(e){log('停止失败：'+e.message,'bad')}}function closeRelay(){if(es){es.close();es=null}$('#relay').disabled=!ch}async function handle(c){let now=Date.now(),k=localStorage.slToken;if(!c||c.v!==1||c.token!==k){log('拒绝：令牌不匹配','bad');return}if(!c.nonce||seen.includes(c.nonce)){log('拒绝：重复命令','bad');return}if(Math.abs(now-c.issuedAt)>SKEW||c.expiresAt<now){log('拒绝：时间过期或设备时钟偏差过大','bad');return}seen=[...seen.slice(-99),c.nonce];if(c.action==='stop'){await halt();return}if(c.action!=='pulse')return;let i=Number(c.intensity),d=Number(c.durationMs);if(!Number.isFinite(i)||!Number.isFinite(d)||i<MINI||i>MAXI||d<100||d>MAXD){log('拒绝：超出安全上限','bad');return}let level=Math.max(1,Math.min(255,Math.round(i/100*255)));await write(new Uint8Array([85,4,0,0,0,level,170]));log('执行 '+i+'% / '+d+'ms','ok');clearTimeout(window.pulseTimer);window.pulseTimer=setTimeout(halt,d)}function startRelay(){closeRelay();let t=localStorage.slTopic,k=localStorage.slToken;if(!t||!k)return log('先保存 topic/token','bad');let since=Math.floor(Date.now()/1000);es=new EventSource('https://ntfy.sh/'+encodeURIComponent(t)+'/sse?since='+since);es.onopen=()=>log('安全中继在线（只监听开启后的新消息）','ok');es.onerror=()=>log('中继连接断开','bad');es.onmessage=async e=>{try{let x=JSON.parse(e.data),m=typeof x.message==='string'?JSON.parse(x.message):x;await handle(m)}catch(err){log('消息解析失败：'+err.message,'bad')}};$('#relay').disabled=true}$('#save').onclick=save;$('#ble').onclick=async()=>{try{dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'SL278B'}],optionalServices:[FFE0]});dev.addEventListener('gattserverdisconnected',()=>{ch=null;closeRelay();log('BLE 已断开','bad')});let s=await dev.gatt.connect(),svc=await s.getPrimaryService(FFE0);ch=await svc.getCharacteristic(FFE1);$('#relay').disabled=false;log('BLE 连接成功，FFE1 可写','ok')}catch(e){log('BLE 连接失败：'+e.message,'bad')}};$('#relay').onclick=startRelay;$('#stop').onclick=halt;$('#off').onclick=async()=>{await halt();closeRelay();try{dev?.gatt.disconnect()}catch{};ch=null;$('#relay').disabled=true;log('已停止并断开','ok')};document.addEventListener('visibilitychange',()=>{if(document.hidden)halt()});window.addEventListener('pagehide',halt);$('#saveRemote').onclick=async()=>{const r=await PolarisRoom.saveFile(new Blob([document.documentElement.outerHTML],{type:'text/html'}),'remote.html');$('#saveMsg').textContent=r.status==='saved'?'已保存到手机。':'未保存：'+r.status};$('#env').textContent=location.protocol==='https:'?'HTTPS / Web Bluetooth 可用':'请使用 HTTPS';</script>
